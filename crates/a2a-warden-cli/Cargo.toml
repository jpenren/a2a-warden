[package]
name = "a2a-warden-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "The single executable: config loading, wiring, migrations on startup for A2A Warden"

[lib]
name = "a2a_warden_cli"
path = "src/lib.rs"

[[bin]]
name = "a2a-warden"
path = "src/main.rs"

[dependencies]
a2a-warden-core = { path = "../a2a-warden-core" }
a2a-warden-store = { path = "../a2a-warden-store" }
a2a-warden-server = { path = "../a2a-warden-server" }
a2a-warden-crypto = { path = "../a2a-warden-crypto" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
config = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
