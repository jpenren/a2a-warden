<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="warden-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f83f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Fondo oscuro -->
  <rect width="128" height="128" rx="30" fill="#0a0f1a" />
  <!-- Triángulo ancho hacia arriba (estilo Astro, más proporcionado) -->
  <path d="M30 106 L64 22 L98 106 Z" fill="url(#warden-grad)" />
  <!-- Línea central vertical sutil -->
  <path d="M64 22 L64 106" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  <!-- Punto central (warde/trust boundary) -->
  <circle cx="64" cy="64" r="9" fill="#0a0f1a" stroke="url(#warden-grad)" stroke-width="3" />
</svg>
