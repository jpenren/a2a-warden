[package]
name = "a2a-warden-e2e"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Cross-crate integration and end to end acceptance suite for A2A Warden"
publish = false

[dependencies]
a2a-warden-core = { path = "../crates/a2a-warden-core" }
a2a-warden-store = { path = "../crates/a2a-warden-store" }
a2a-warden-server = { path = "../crates/a2a-warden-server" }
a2a-warden-cli = { path = "../crates/a2a-warden-cli" }
axum = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tempfile = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
