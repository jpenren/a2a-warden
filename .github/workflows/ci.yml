name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly PostgreSQL test run
    - cron: '0 2 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ============================================================
  # Linting and formatting
  # ============================================================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build the console assets
        run: make frontend
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================
  # Security audit
  # ============================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-audit
          version: latest
      - name: Run audit
        run: cargo audit

  # ============================================================
  # Unit and integration tests (SQLite)
  # ============================================================
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: sqlite
      - name: Build the console assets
        run: make frontend
      - name: Run tests (SQLite)
        run: cargo test --workspace
        env:
          A2AWARDEN_DATABASE__BACKEND: sqlite

  # ============================================================
  # Unit and integration tests (PostgreSQL)
  # ============================================================
  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a2a_warden
          POSTGRES_PASSWORD: a2a_warden
          POSTGRES_DB: a2a_warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U a2a_warden"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: postgres
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U a2a_warden; then
              break
            fi
            sleep 1
          done
      - name: Build the console assets
        run: make frontend
      - name: Run tests (PostgreSQL)
        run: cargo test --workspace
        env:
          DATABASE_URL: postgresql://a2a_warden:a2a_warden@localhost:5432/a2a_warden

  # ============================================================
  # Pizza shop demo (four agents supervised by the warden)
  # ============================================================
  pizza-demo:
    name: Pizza Shop Demo
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatin/Cargo-cache@v2
        with:
          key: pizza-demo
      - name: Build the console assets
        run: make frontend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/pizza-shop/requirements.txt
      - name: Install the demo dependencies
        run: python -m pip install -r examples/pizza-shop/requirements.txt
      - name: Run the scenario
        run: bash examples/pizza-shop/scripts/run_scenario.sh

  # ============================================================
  # Frontend build
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify build output
        run: test -f dist/index.html

  # ============================================================
  # Binary build (cross-platform)
  # ============================================================
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [fmt, clippy, audit, test-sqlite, frontend-build]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build the console assets
        run: make frontend
      - name: Install cross (for non-native targets)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --locked
      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --bin a2a-warden
          else
            cross build --release --bin a2a-warden --target ${{ matrix.target }}
          fi
      - name: Verify binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            ./target/${{ matrix.target }}/release/a2a-warden.exe --help
          else
            ./target/${{ matrix.target }}/release/a2a-warden --help
          fi

  # ============================================================
  # Documentation build check
  # ============================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: cargo doc --all --no-deps --document-private-items
      - name: Check for broken links
        run: |
          # Basic check - ensure docs build without warnings
          cargo doc --all --no-deps 2>&1 | grep -i "warning" && exit 1 || true

  # ============================================================
  # Summary
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [fmt, clippy, audit, test-sqlite, test-postgres, frontend-build, pizza-demo, build-binary, docs]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "All CI checks completed"
          if [ "${{ needs.fmt.result }}" != "success" ] || \
             [ "${{ needs.clippy.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.test-sqlite.result }}" != "success" ] || \
             [ "${{ needs.test-postgres.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.pizza-demo.result }}" != "success" ] || \
             [ "${{ needs.build-binary.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed!"