name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'frontend/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Build and test Docker image
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (local test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: a2a-warden:test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image startup
        run: |
          docker run --rm -d --name a2a-warden-test -p 8080:8080 \
            -e A2AWARDEN_SERVER__LISTEN_ADDR=0.0.0.0:8080 \
            -e A2AWARDEN_DATABASE__BACKEND=sqlite \
            -e A2AWARDEN_DATABASE__SQLITE__PATH=/var/lib/a2a-warden/a2a-warden.db \
            -v a2a-warden-test-data:/var/lib/a2a-warden \
            a2a-warden:test
          sleep 5
          curl -f http://localhost:8080/api/v1/admin/health || (docker logs a2a-warden-test && exit 1)
          curl -f http://localhost:8080/ui || (docker logs a2a-warden-test && exit 1)
          curl -f http://localhost:8080/.well-known/agent-card.json || (docker logs a2a-warden-test && exit 1)
          docker stop a2a-warden-test
      - name: Cleanup
        run: docker volume rm a2a-warden-test-data

  # ============================================================
  # Publish to GHCR on main branch
  # ============================================================
  publish:
    name: Publish to GHCR
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/a2a-warden
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Multi-arch verification
  # ============================================================
  verify-multiarch:
    name: Verify Multi-arch
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull and verify amd64
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/a2a-warden:latest
          docker run --rm --platform linux/amd64 \
            ghcr.io/${{ github.repository_owner }}/a2a-warden:latest --help
      - name: Pull and verify arm64
        run: |
          docker run --rm --platform linux/arm64 \
            ghcr.io/${{ github.repository_owner }}/a2a-warden:latest --help