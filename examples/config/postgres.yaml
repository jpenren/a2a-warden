# Sample A2A Warden configuration (PostgreSQL).
#
# The same binary, the same domain code, and the same test suite run against
# PostgreSQL: only the `database.backend` setting changes (decision AD-2).
#
# The URL can be overridden with the environment variable
# A2AWARDEN_DATABASE__POSTGRES__URL.

server:
  listen_addr: "127.0.0.1:8080"
  a2a_version: "1.0"
  request_timeout_secs: 30
  max_body_size: 10485760
  cors_enabled: true
  cors_origins: []
  public_url: "http://127.0.0.1:8080"

database:
  backend: postgres
  postgres:
    url: "postgresql://a2a_warden:a2a_warden@127.0.0.1:5432/a2a_warden"
    max_connections: 10
    min_connections: 1
    connect_timeout_secs: 10

agents:
  - name: "echo-agent"
    url: "http://127.0.0.1:9001"
    skills: ["echo"]

retention:
  audit_days: 90
  task_days: 30
  auto_purge: false
  purge_interval_hours: 24

frontend:
  enabled: true
  path: "/ui"
  spa_fallback: "/ui/index.html"

admin:
  enabled: true
  path: "/api/v1/admin"
  token: null
  token_header: "X-Admin-Token"

# Cedar policy engine configuration (Phase 4)
policy:
  rules:
    - id: "escalate-all-skills"
      description: "Escalate all tasks for human approval by default"
      active: true
      effect: escalate
      condition: "targetAgent == 'echo-agent' && skill != ''"
      version: 1
      created_at: "2026-01-01T00:00:00Z"
