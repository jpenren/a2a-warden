[workspace]
resolver = "2"
members = [
    "crates/a2a-warden-core",
    "crates/a2a-warden-store",
    "crates/a2a-warden-server",
    "crates/a2a-warden-cli",
    "crates/a2a-warden-crypto",
    "tests",
]
exclude = ["frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/a2a-warden/a2a-warden"
description = "A2A Warden - See every message. Verify every agent. Approve every task."
categories = ["network-programming", "asynchronous", "web-programming", "command-line-utilities"]
keywords = ["a2a", "agent2agent", "agents", "human-in-the-loop", "governance", "supervision"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
config = { version = "0.14", features = ["yaml"] }

# HTTP
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", default-features = false, features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.0", features = ["full"] }
http = "1.0"
http-body = "1.0"
hyper-util = { version = "0.1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "json", "migrate"] }
sqlite = { version = "0.37", features = ["bundled"] }

# Frontend embedding
rust-embed = "8.6"

# Crypto (for phase 3)
jsonwebtoken = "9.3"
serde_json_canonicalizer = "0.4"
p521 = "0.14"
ring = "0.17"
base64 = "0.22"

# Policy engine (for later phases)
cedar-policy = "4.14"
cedar-policy-core = "4.14"

# Hash-chained audit log (Phase 5)
sha2 = "0.10"
hex = "0.4"

# PII masking (Phase 5)
regex = "1.10"

# Utilities
uuid = { version = "1.8", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }

# Async trait objects (store traits are dispatched dynamically in the server state)
async-trait = "0.1"

# HTTP client (the warden acts as an A2A client toward registered remote agents)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
] }

# Testing
tokio-test = "0.4"
bytes = "1.7"
http-body-util = "0.1"
tempfile = "3.10"

[workspace.lints.rust]

[workspace.lints.clippy]
# Lint groups are set at priority -1 so the explicit per-lint settings below
# always take precedence over them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

# Allow specific lints that are too noisy or conflict with our style
implicit_return = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
question_mark_used = "allow"
single_match_else = "allow"
too_many_lines = "allow"
type_complexity = "allow"
enum_glob_use = "allow"
wildcard_imports = "allow"
similar_names = "allow"
items_after_statements = "allow"
large_enum_variant = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unnecessary_wrap = "allow"
redundant_closure_for_method_calls = "allow"
needless_pass_by_value = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
non_ascii_literal = "allow"
unseparated_literal_suffix = "allow"
doc_markdown = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The domain errors carry human readable context; the store errors are
# converted at the boundary, so the `from` conversions are the right shape.
from_over_into = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.ci]
inherits = "release"
debug = 0

[profile.test]
debug = true